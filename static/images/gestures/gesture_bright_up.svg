<svg viewBox="0 0 140 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tG" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#62caff"/><stop offset="1" stop-color="#1a72d0"/></linearGradient>
    <linearGradient id="palmG" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1e3d5c"/><stop offset="1" stop-color="#0d1f33"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="140" height="190" rx="18" fill="#060c14"/>
  <radialGradient id="bgG" cx="38%" cy="40%" r="38%"><stop stop-color="#0f2a48" stop-opacity="0.7"/><stop offset="1" stop-color="#060c14" stop-opacity="0"/></radialGradient>
  <rect width="140" height="190" rx="18" fill="url(#bgG)"/>
  <!-- Wrist -->
  <rect x="47" y="157" width="46" height="28" rx="11" fill="#0d1e30"/>
  <!-- Palm (fist) -->
  <rect x="20" y="90" width="100" height="76" rx="18" fill="url(#palmG)"/>
  <rect x="28" y="94" width="84" height="26" rx="12" fill="rgba(255,255,255,0.03)"/>
  <!-- Curled finger knuckles (just the ridge) -->
  <rect x="29" y="80" width="19" height="20" rx="9.5" fill="#1c3756"/>
  <rect x="51" y="74" width="19" height="22" rx="9.5" fill="#1c3756"/>
  <rect x="73" y="80" width="19" height="20" rx="9.5" fill="#1c3756"/>
  <rect x="94" y="86" width="16" height="18" rx="8" fill="#1a3450"/>
  <!-- Knuckle line -->
  <rect x="29" y="86" width="81" height="2" rx="1" fill="rgba(59,158,255,0.1)"/>
  <!-- THUMB extended UPWARD (tall, slightly angled, centered-left) -->
  <rect x="38" y="12" width="19" height="90" rx="9.5" fill="url(#tG)" filter="url(#glow)"/>
  <!-- Thumb nail -->
  <rect x="41.5" y="14" width="12" height="12" rx="5.5" fill="rgba(220,240,255,0.32)"/>
  <!-- Thumb joint lines -->
  <rect x="38" y="56" width="19" height="2" rx="1" fill="rgba(0,0,0,0.2)"/>
  <rect x="38" y="74" width="19" height="2" rx="1" fill="rgba(0,0,0,0.18)"/>
  <!-- Bright glow behind thumb -->
  <rect x="28" y="8" width="38" height="92" rx="14" fill="rgba(59,158,255,0.07)"/>
  <!-- Up arrow hint (subtle) -->
  <path d="M57 28 L53 36 L55.5 36 L55.5 45 L58.5 45 L58.5 36 L61 36 Z" fill="rgba(255,255,255,0.08)"/>
</svg>
