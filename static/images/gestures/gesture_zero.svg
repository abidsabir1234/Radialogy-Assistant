<svg viewBox="0 0 140 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="palmG" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1e3d5c"/><stop offset="1" stop-color="#0d1f33"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- Background -->
  <rect width="140" height="190" rx="18" fill="#060c14"/>
  <radialGradient id="bgG" cx="50%" cy="55%" r="45%"><stop stop-color="#0f2540" stop-opacity="0.8"/><stop offset="1" stop-color="#060c14" stop-opacity="0"/></radialGradient>
  <rect width="140" height="190" rx="18" fill="url(#bgG)"/>
  <!-- Wrist -->
  <rect x="47" y="157" width="46" height="28" rx="11" fill="#0d1e30"/>
  <rect x="52" y="157" width="36" height="4" rx="2" fill="#0f2438" opacity="0.8"/>
  <!-- Palm (fist - slightly rounder) -->
  <rect x="18" y="88" width="104" height="78" rx="18" fill="url(#palmG)"/>
  <!-- Palm highlight -->
  <rect x="26" y="92" width="88" height="30" rx="12" fill="rgba(255,255,255,0.03)"/>
  <!-- Curled finger knuckle row - visible ridge -->
  <rect x="27" y="78" width="20" height="20" rx="10" fill="#1c3756"/>
  <rect x="50" y="72" width="20" height="22" rx="10" fill="#1c3756"/>
  <rect x="73" y="78" width="20" height="20" rx="10" fill="#1c3756"/>
  <rect x="95" y="84" width="17" height="18" rx="8.5" fill="#1a3450"/>
  <!-- Thumb (wrapped left side) -->
  <rect x="12" y="104" width="14" height="36" rx="7" fill="#152840"/>
  <!-- Knuckle highlight line -->
  <rect x="27" y="84" width="85" height="2" rx="1" fill="rgba(59,158,255,0.12)"/>
  <!-- Label hint glow -->
  <circle cx="70" cy="130" r="28" fill="rgba(59,158,255,0.03)"/>
</svg>
