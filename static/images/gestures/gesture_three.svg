      <stop offset="0%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#050d1a"/>
    </radialGradient>
    <linearGradient id="skinGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5c5a3"/>
      <stop offset="50%" stop-color="#e8a882"/>
      <stop offset="100%" stop-color="#d4896a"/>
    </linearGradient>
    <filter id="shadow3">
