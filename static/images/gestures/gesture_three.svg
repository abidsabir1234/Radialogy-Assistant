        fill="#b8714f" stroke="#c07850" stroke-width="1"/>

  <ellipse cx="73" cy="56" rx="9" ry="6" fill="#00b4d8" opacity="0.12"/>
  <ellipse cx="97" cy="43" rx="9" ry="6" fill="#00b4d8" opacity="0.12"/>
  <ellipse cx="121" cy="51" rx="9" ry="6" fill="#00b4d8" opacity="0.12"/>
