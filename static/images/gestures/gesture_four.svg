<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <radialGradient id="bgGlow4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#050d1a"/>
    </radialGradient>
    <linearGradient id="skinGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5c5a3"/>
      <stop offset="50%" stop-color="#e8a882"/>
      <stop offset="100%" stop-color="#d4896a"/>
    </linearGradient>
    <filter id="shadow4">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00b4d8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="200" height="240" fill="url(#bgGlow4)" rx="16"/>
  <ellipse cx="100" cy="200" rx="70" ry="30" fill="#00b4d8" opacity="0.08"/>

  <!-- Palm -->
  <path d="M 52 155 Q 48 200 55 225 Q 100 235 145 225 Q 152 200 148 155 Q 140 148 100 146 Q 60 148 52 155 Z"
