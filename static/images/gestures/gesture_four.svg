  <!-- Index Finger -->
  <rect x="52" y="55" width="20" height="100" rx="10" fill="url(#skinGrad4)" filter="url(#shadow4)"/>
  <ellipse cx="62" cy="58" rx="10" ry="8" fill="#f5c5a3" stroke="#d4896a" stroke-width="0.8"/>

  <!-- Middle Finger -->
  <rect x="75" y="42" width="20" height="113" rx="10" fill="url(#skinGrad4)" filter="url(#shadow4)"/>
  <ellipse cx="85" cy="45" rx="10" ry="8" fill="#f5c5a3" stroke="#d4896a" stroke-width="0.8"/>

  <!-- Ring Finger -->
  <rect x="98" y="50" width="20" height="105" rx="10" fill="url(#skinGrad4)" filter="url(#shadow4)"/>
  <ellipse cx="108" cy="53" rx="10" ry="8" fill="#f5c5a3" stroke="#d4896a" stroke-width="0.8"/>

  <!-- Pinky Finger -->
  <rect x="121" y="70" width="18" height="85" rx="9" fill="url(#skinGrad4)" filter="url(#shadow4)"/>
  <ellipse cx="130" cy="73" rx="9" ry="7" fill="#f5c5a3" stroke="#d4896a" stroke-width="0.8"/>

  <ellipse cx="62" cy="56" rx="8" ry="5" fill="#00b4d8" opacity="0.12"/>
  <ellipse cx="85" cy="43" rx="8" ry="5" fill="#00b4d8" opacity="0.12"/>
  <ellipse cx="108" cy="51" rx="8" ry="5" fill="#00b4d8" opacity="0.12"/>
  <ellipse cx="130" cy="71" rx="7" ry="4" fill="#00b4d8" opacity="0.12"/>
